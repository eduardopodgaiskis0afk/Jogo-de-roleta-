<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="10" rx="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
  </div>

  <div class="card">
    <div class="panels">
      <!-- PAINEL LOGIN -->
      <div class="panel active" id="panel-entrar">
        <h1>Bem-vindo de volta</h1>
        <p class="subtitle">Entre com seu e-mail e senha para continuar.</p>

        <div class="msg" id="msg-entrar"></div>

        <form id="form-login" novalidate>
          <div class="field">
            <label for="email-entrar">E-mail</label>
            <input type="email" id="email-entrar" placeholder="voce@exemplo.com" required>
          </div>

          <div class="field">
            <label for="senha-entrar">Senha</label>
            <div class="input-wrap">
              <input type="password" id="senha-entrar" placeholder="••••••••" required minlength="6">
              <button type="button" class="toggle-eye" onclick="alternarSenha('senha-entrar', this)" aria-label="Mostrar senha">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <div class="row-between">
            <label class="checkbox">
              <input type="checkbox">
              Manter conectado
            </label>
          </div>
          <button type="submit" class="submit">Entrar</button>
        </form>

        <p class="foot-note">Não tem conta? <a href="cadastro.html" class="link">Registre-se</a></p>
      </div>
    </div>
  </div>
</div>

<script src="../js/cadastro.js"></script>
<script>
function alternarSenha(id, botao){
  const input = document.getElementById(id);
  const visivel = input.type === 'text';
  input.type = visivel ? 'password' : 'text';
  botao.style.color = visivel ? '' : 'var(--purple-2)';
}

function mostrarMsg(id, texto){
  const el = document.getElementById(id);
  el.textContent = texto;
  el.classList.add('show');
}

document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('form-login');
  if (form) {
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (typeof enviarLogin === 'function') {
        enviarLogin(event);
      }
    });
  }
});
</script>

</body>
</html>
