<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endereço de Entrega — Resgate do Prêmio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Jogo-de-roleta-/Style/style.css">

  <!-- Só o que o style.css não tem -->
  <style>
    :root{
      --gold-2:#ffe27a;
      --green:#22c55e;
      --green-2:#4ade80;
      --green-glow:rgba(34,197,94,.35);
    }

    .scene.scene-endereco{ max-width:560px; }

    .titulo{ text-align:center; margin-bottom:22px; }
    .titulo .subtitle{ margin-bottom:0; line-height:1.5; }
    .titulo .subtitle span{ color:var(--text); font-weight:600; }
    .eyebrow{
      display:inline-block; margin-bottom:12px; padding:5px 12px; border-radius:999px;
      font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase;
      color:var(--gold-2); background:rgba(228,177,58,.12);
    }

    /* Inputs de texto (o style.css só estiliza email e password) */
    input[type="text"]{
      width:100%; padding:12px 14px; font-family:'Inter',sans-serif; font-size:14px;
      color:var(--text); background:var(--bg-1); border:1px solid var(--card-border);
      border-radius:10px; outline:none;
      transition:border-color .2s ease, box-shadow .2s ease;
    }
    input[type="text"]:focus{ border-color:var(--purple-1); box-shadow:0 0 0 3px var(--purple-glow); }
    input[type="text"].invalid{ border-color:var(--danger); }
    input[type="text"][readonly]{ color:var(--text-dim); cursor:default; }
    input[type="text"][readonly]:focus{ border-color:var(--card-border); box-shadow:none; }

    /* CEP + botão buscar */
    .cep-row{ display:flex; gap:10px; align-items:flex-end; }
    .cep-row .field{ flex:1; margin-bottom:0; }
    .buscar-btn{
      flex:0 0 auto; padding:12px 22px; border:none; border-radius:10px; cursor:pointer;
      font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; color:#fff;
      background:linear-gradient(135deg,var(--purple-1),#6d4fd1);
      box-shadow:0 10px 24px -8px var(--purple-glow);
      transition:filter .15s, transform .15s, opacity .15s;
    }
    .buscar-btn:hover:not(:disabled){ filter:brightness(1.08); transform:translateY(-1px); }
    .buscar-btn:disabled{ opacity:.55; cursor:not-allowed; }

    .cep-status{ min-height:16px; margin:8px 0 18px; font-size:12px; }
    .cep-status.loading{ color:var(--text-dim); }
    .cep-status.error{ color:var(--danger); }
    .cep-status.success{ color:var(--green-2); }

    /* Campos */
    .row-2{ display:flex; gap:12px; }
    .row-2 .field{ flex:1; min-width:0; }
    .err-msg{ display:none; margin-top:5px; font-size:11.5px; color:var(--danger); }
    .field.has-error .err-msg{ display:block; }
    .field.has-error input{ border-color:var(--danger); }

    .endereco-box{ display:none; }
    .endereco-box.show{ display:block; animation:fade .35s ease; }

    /* Confirmar */
    .confirmar-btn{
      display:block; width:100%; margin-top:6px; padding:14px 24px; border:none; border-radius:10px; cursor:pointer;
      font-family:'Space Grotesk',sans-serif; font-size:14.5px; font-weight:600; color:#052e12;
      background:linear-gradient(135deg,var(--green-2),var(--green));
      box-shadow:0 10px 24px -8px var(--green-glow);
      transition:transform .15s, filter .15s, opacity .15s;
    }
    .confirmar-btn:hover:not(:disabled){ filter:brightness(1.06); transform:translateY(-1px); }
    .confirmar-btn:disabled{ opacity:.5; cursor:not-allowed; }

    /* Botão com aparência de link */
    button.link{ padding:0; border:0; background:none; font:inherit; cursor:pointer; }

    @media (max-width:480px){
      .row-2{ flex-direction:column; gap:0; }
    }
  </style>
</head>
<body>

  <div class="scene scene-endereco">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
    </div>

    <div class="card">
      <div class="panels">

        <div class="titulo">
          <span class="eyebrow">Etapa 2 de 2</span>
          <h1>Endereço de entrega</h1>
          <p class="subtitle">
            Olá, <span id="saudacaoNome">ganhador(a)</span>!
            Informe seu CEP para localizarmos seu endereço automaticamente.
          </p>
        </div>

        <form id="cepForm" novalidate>
          <div class="cep-row">
            <div class="field" id="fieldCep">
              <label for="cep">CEP</label>
              <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" inputmode="numeric" autocomplete="postal-code">
              <div class="err-msg">Digite um CEP válido (8 dígitos).</div>
            </div>
            <button type="button" class="buscar-btn" id="buscarBtn">Buscar</button>
          </div>
          <div class="cep-status" id="cepStatus" role="status" aria-live="polite"></div>

          <div class="endereco-box" id="enderecoBox">
            <div class="field" id="fieldRua">
              <label for="rua">Rua</label>
              <input type="text" id="rua" name="rua" readonly>
            </div>

            <div class="row-2">
              <div class="field" id="fieldBairro">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" name="bairro" readonly>
              </div>
              <div class="field" id="fieldCidade">
                <label for="cidade">Cidade / UF</label>
                <input type="text" id="cidade" name="cidade" readonly>
              </div>
            </div>

            <div class="row-2">
              <div class="field" id="fieldNumero">
                <label for="numero">Número</label>
                <input type="text" id="numero" name="numero" placeholder="Ex: 123" inputmode="numeric">
                <div class="err-msg">Informe o número.</div>
              </div>
              <div class="field" id="fieldComplemento">
                <label for="complemento">Complemento (opcional)</label>
                <input type="text" id="complemento" name="complemento" placeholder="Apto, bloco, referência...">
              </div>
            </div>
          </div>

          <button type="submit" class="confirmar-btn" id="confirmarBtn" disabled>Confirmar e enviar</button>
        </form>

        <p class="foot-note">
          Precisa de ajuda?
          <button type="button" class="link" data-rota="contato">Fale com a gente</button>
        </p>

      </div>
    </div>
  </div>

  <script>
    // Rotas da aplicação
    const ROTAS = {
      contato: './contato.html'   // troque se o nome do arquivo for outro
    };

    function irPara(nomeRota) {
      const destino = ROTAS[nomeRota];
      if (destino) window.location.href = destino;
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-rota]').forEach((botao) => {
        botao.addEventListener('click', () => irPara(botao.dataset.rota));
      });
    });
  </script>
  <script src="../js/cep.js"></script>

</body>
</html>
