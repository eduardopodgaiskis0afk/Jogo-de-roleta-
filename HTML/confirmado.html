<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido enviado!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0f0c17;
    --bg-2:#181425;
    --panel:#1c1830;
    --panel-border:#332b4d;
    --text:#ece9f5;
    --text-dim:#a8a3ba;
    --green:#22c55e;
    --green-2:#4ade80;
    --green-glow:rgba(34,197,94,.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter', sans-serif;
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
    background:
      radial-gradient(circle at 20% 10%, rgba(139,92,246,.16), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(228,177,58,.10), transparent 40%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
  }
  .wrap{ width:100%; max-width:480px; }
  .panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:20px;
    padding:36px 28px;
    box-shadow:0 24px 60px -24px rgba(0,0,0,.6);
    text-align:center;
    animation:fade .4s ease;
  }
  @keyframes fade{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  @media (prefers-reduced-motion:reduce){ .panel{ animation:none; } }

  .check{
    width:62px; height:62px; margin:0 auto 18px; border-radius:50%;
    background:rgba(34,197,94,.14);
    display:flex; align-items:center; justify-content:center;
  }
  .check svg{ width:30px; height:30px; color:var(--green-2); }

  h1{ font-family:'Space Grotesk', sans-serif; font-size:22px; font-weight:700; margin:0 0 8px; }
  p{ font-size:13.5px; color:var(--text-dim); line-height:1.55; margin:0 0 26px; }

  .btn{
    display:block; width:100%; padding:14px 24px; border-radius:10px;
    text-align:center; text-decoration:none;
    font-family:'Space Grotesk',sans-serif; font-size:14.5px; font-weight:600; color:#052e12;
    background:linear-gradient(135deg,var(--green-2),var(--green));
    box-shadow:0 10px 24px -8px var(--green-glow);
    transition:transform .15s, filter .15s;
  }
  .btn:hover{ filter:brightness(1.06); transform:translateY(-1px); }
  .btn:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--green-glow); }
</style>
</head>
<body>
<div class="wrap">
  <main class="panel">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
    </div>
    <h1>Pedido enviado!</h1>
    <p>Recebemos seus dados. Seu prêmio será enviado para o endereço informado.</p>
    <a class="btn" href="roleta.html">Voltar para o menu principal</a>
  </main>
</div>
</body>
</html>
