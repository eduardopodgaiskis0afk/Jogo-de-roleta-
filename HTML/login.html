<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../Style/style.css">
</head>
<body>
<div class="scene">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path></svg>
  </div>
  <div class="card">
    <h1>Entrar</h1>
    <p class="subtitle">Use o e-mail e a senha cadastrados para girar a roleta.</p>
    <div class="msg" id="msg-login" role="alert"></div>

    <form id="form-login" novalidate>
      <div class="field">
        <label for="email-login">E-mail</label>
        <input type="email" id="email-login" placeholder="voce@exemplo.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="senha-login">Senha</label>
        <div class="input-wrap">
          <input type="password" id="senha-login" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle-eye" data-olho="senha-login" aria-label="Mostrar senha"></button>
        </div>
      </div>
      <button type="submit" class="submit" id="btn-login">Entrar</button>
    </form>

    <p class="foot-note">Ainda não tem conta? <a href="cadastro.html" class="link">Criar conta</a></p>
  </div>
</div>

<script src="../js/auth.js"></script>
<script>
document.querySelectorAll('[data-olho]').forEach(b => {
  b.innerHTML = OLHO;
  b.addEventListener('click', () => alternarSenha(b.dataset.olho, b));
});

document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const $ = (id) => document.getElementById(id);
  const email = $('email-login').value.trim().toLowerCase();
  const senha = $('senha-login').value;

  if (!emailValido(email)) { mostrarMsg('msg-login', 'Informe um endereço de e-mail válido.'); return $('email-login').focus(); }
  if (!senha) { mostrarMsg('msg-login', 'Informe sua senha.'); return $('senha-login').focus(); }

  $('btn-login').disabled = true;
  const permissao = pedirPermissaoNotificacao();   // precisa ser chamado dentro do clique/envio
  const r = await autenticarUsuario(email, senha);
  if (!r.ok) { $('btn-login').disabled = false; return mostrarMsg('msg-login', r.message); }

  await permissao;
  const texto = notificarBoasVindas(r.nome);        // notificação do navegador
  mostrarMsg('msg-login', `${texto}! Redirecionando...`, 'sucesso');

  let destino = './roleta.html';
  try { destino = sessionStorage.getItem('voltarPara') || destino; sessionStorage.removeItem('voltarPara'); } catch (err) {}
  setTimeout(() => { window.location.href = destino; }, 1800);
});
</script>
</body>
</html>
