<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../Style/style.css">
</head>
<body>
<div class="scene">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
  </div>
  <div class="card">
    <h1>Criar conta</h1>
    <p class="subtitle">Informe seus dois primeiros nomes, e-mail e crie uma senha.</p>
    <div class="msg" id="msg-registrar" role="alert"></div>

    <form id="form-registrar" novalidate>
      <div class="field">
        <label for="nome-registrar">Dois primeiros nomes</label>
        <input type="text" id="nome-registrar" placeholder="Ex: João Pedro" autocomplete="given-name">
      </div>
      <div class="field">
        <label for="email-registrar">E-mail</label>
        <input type="email" id="email-registrar" placeholder="voce@exemplo.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="senha-registrar">Senha</label>
        <div class="input-wrap">
          <input type="password" id="senha-registrar" placeholder="Mínimo de 6 caracteres" autocomplete="new-password">
          <button type="button" class="toggle-eye" data-olho="senha-registrar" aria-label="Mostrar senha"></button>
        </div>
        <div class="strength"><div class="strength-fill" id="strength-fill"></div></div>
      </div>
      <div class="field">
        <label for="senha-confirmar">Confirmar senha</label>
        <div class="input-wrap">
          <input type="password" id="senha-confirmar" placeholder="••••••••" autocomplete="new-password">
          <button type="button" class="toggle-eye" data-olho="senha-confirmar" aria-label="Mostrar confirmação de senha"></button>
        </div>
      </div>
      <button type="submit" class="submit" id="btn-registrar">Criar conta</button>
    </form>

    <p class="foot-note">Já tem conta? <a href="login.html" class="link">Entrar</a></p>
  </div>
</div>

<script src="../js/auth.js"></script>
<script>
document.querySelectorAll('[data-olho]').forEach(b => {
  b.innerHTML = OLHO;
  b.addEventListener('click', () => alternarSenha(b.dataset.olho, b));
});
document.getElementById('senha-registrar').addEventListener('input', e => checarForca(e.target.value));

document.getElementById('form-registrar').addEventListener('submit', async (e) => {
  e.preventDefault();
  const $ = (id) => document.getElementById(id);
  const partes = $('nome-registrar').value.trim().replace(/\s+/g, ' ').split(' ').filter(Boolean);
  const email = $('email-registrar').value.trim().toLowerCase();
  const senha = $('senha-registrar').value;
  const erro = (msg, campo) => { mostrarMsg('msg-registrar', msg); $(campo).focus(); };

  if (partes.length < 2 || !partes.slice(0, 2).every(p => /^\p{L}{2,}$/u.test(p)))
    return erro('Informe seus dois primeiros nomes, só com letras (ex: João Pedro).', 'nome-registrar');
  if (!emailValido(email)) return erro('Informe um endereço de e-mail válido.', 'email-registrar');
  if (senha.length < 6) return erro('A senha deve ter no mínimo 6 caracteres.', 'senha-registrar');
  if (senha !== $('senha-confirmar').value) return erro('As senhas não conferem. Tente novamente.', 'senha-confirmar');

  const nome = formatarDoisPrimeirosNomes(partes.join(' '));
  $('btn-registrar').disabled = true;
  const r = await salvarUsuarioLocal(email, senha, nome);
  if (!r.ok) { $('btn-registrar').disabled = false; return mostrarMsg('msg-registrar', r.message); }

  mostrarMsg('msg-registrar', `Conta criada com sucesso, ${nome}! Redirecionando para o login...`, 'sucesso');
  setTimeout(() => { window.location.href = 'login.html'; }, 1500);
});
</script>
</body>
</html>
